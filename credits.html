<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Credits — OreBridge Minerals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0d3b66">
<style>
  :root { --bg:#f3f5f7; --card:#ffffff; --border:#d6dce2; --text:#15202b; --muted:#5b6875; --accent:#0d3b66; --link:#1a5a96; }
  * { box-sizing: border-box; }
  body { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 30px 16px; line-height: 1.6; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { color: var(--accent); }
  a { color: var(--link); }
  .topbar { background: #0a2540; color: #fff; margin: -30px -16px 24px; padding: 10px 16px; }
  .topbar a { color: #fff; font-weight: 600; }
  p.note { color: var(--muted); }
  .credit { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 3px; padding: 12px; margin: 12px 0; }
  .credit img { width: 110px; height: 74px; object-fit: cover; border-radius: 7px; flex-shrink: 0; }
  .credit div { font-size: .9rem; min-width: 0; overflow-wrap: anywhere; }
  .credit span { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="index.html">← Back to OreBridge Minerals</a></div>
  <h1>Photo Credits</h1>
  <p class="note">Product and background photographs are from Wikimedia Commons and are used under
    their respective free licenses. Photos are illustrative of the mineral type and are not
    images of OreBridge stock. Each entry links to the original file, author and license.</p>
  <div id="list"></div>
</div>
<script>
fetch("images/credits.json").then((r) => r.json()).then((items) => {
  const list = document.getElementById("list");
  items.forEach((c) => {
    const row = document.createElement("div");
    row.className = "credit";
    const img = document.createElement("img");
    img.src = "images/" + c.id + ".jpg";
    img.alt = c.id;
    const info = document.createElement("div");
    const a = document.createElement("a");
    a.href = c.source; a.target = "_blank"; a.rel = "noopener";
    a.textContent = decodeURIComponent(c.source.split("/").pop()).replace(/_/g, " ");
    const meta = document.createElement("span");
    meta.textContent = " — " + c.artist + " · " + c.license;
    info.append(a, document.createElement("br"), meta);
    row.append(img, info);
    list.appendChild(row);
  });
}).catch(() => {
  document.getElementById("list").textContent = "Credits list could not be loaded.";
});
</script>
</body>
</html>
